services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pointroom}
      POSTGRES_USER: ${POSTGRES_USER:-pointroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pointroom} -d ${POSTGRES_DB:-pointroom}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    mem_limit: ${POINTROOM_MEMORY_LIMIT:-512m}
    cpus: ${POINTROOM_CPU_LIMIT:-1.0}
    pids_limit: ${POINTROOM_PIDS_LIMIT:-256}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POINTROOM_DATABASE_HOST: postgres
      POINTROOM_DATABASE_PORT: "5432"
      POINTROOM_DATABASE_NAME: ${POSTGRES_DB:-pointroom}
      POINTROOM_DATABASE_USER: ${POSTGRES_USER:-pointroom}
      POINTROOM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POINTROOM_HOST: 0.0.0.0
      POINTROOM_PORT: "5000"
      POINTROOM_REQUIRE_HTTPS: "0"
      POINTROOM_RETENTION_CLEANUP_ENABLED: "${POINTROOM_RETENTION_CLEANUP_ENABLED:-1}"
      POINTROOM_RETENTION_CLEANUP_INTERVAL_SECONDS: "${POINTROOM_RETENTION_CLEANUP_INTERVAL_SECONDS:-86400}"
      POINTROOM_RETENTION_DAYS: "${POINTROOM_RETENTION_DAYS:-30}"
      POINTROOM_LOG_LEVEL: "${POINTROOM_LOG_LEVEL:-INFO}"
      POINTROOM_MAX_REQUEST_BYTES: "${POINTROOM_MAX_REQUEST_BYTES:-16384}"
      POINTROOM_SOCKET_MAX_MESSAGE_BYTES: "${POINTROOM_SOCKET_MAX_MESSAGE_BYTES:-16384}"
      POINTROOM_MAX_ACTIVE_ROOMS: "${POINTROOM_MAX_ACTIVE_ROOMS:-1000}"
      POINTROOM_MAX_SOCKET_CONNECTIONS: "${POINTROOM_MAX_SOCKET_CONNECTIONS:-500}"
    ports:
      - "${POINTROOM_PUBLISH_HOST:-127.0.0.1}:${POINTROOM_PUBLISH_PORT:-5000}:5000"

volumes:
  postgres-data:
