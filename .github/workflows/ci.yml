name: CI

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  version-check:
    name: Version bump check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version bump for code changes
        env:
          VERSION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          VERSION_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_version_bump.py --base "${VERSION_BASE_SHA}" --head "${VERSION_HEAD_SHA}"

  tests:
    name: Python tests (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: version-check
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  tests-postgres:
    name: Python tests (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: version-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pointroom
          POSTGRES_USER: pointroom
          POSTGRES_PASSWORD: pointroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pointroom -d pointroom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POINTROOM_TEST_DATABASE_URL: postgres://pointroom:pointroom@127.0.0.1:5432/pointroom
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  container:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: version-check
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag pointroom:ci .
      - name: Smoke-test image
        run: docker run --rm pointroom:ci python -c "import wsgi; print(wsgi.app.config['APP_VERSION'])"
